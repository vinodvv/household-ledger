<!DOCTYPE html>

<html>

<head>
    <meta charset="UTF-8">
    <title>Household Ledger</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
        {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div style="background:#fff; border:1px solid var(--paper-line); border-left:3px solid var(--moss); padding:8px 12px; border-radius:6px; margin-bottom:16px; font-size:0.85rem;">
                {{ messages[0] }}
            </div>
        {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>

</html>
